<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Ganga Saw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">Ganga Saw</a>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="contact_form.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Contact Me</h2>
            <p>Fill the form below or find me on
                <a href="https://www.linkedin.com/in/ganga-saw-218613420" target="_blank" rel="noopener">LinkedIn</a>.
            </p>

            <form id="contact_form">
                <label for="name">Name</label>
                <input type="text" id="name"  name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@gmail.com" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    
<footer class="footer">
    <h4>Ganga Saw</h4>
    <h4>gangasaw15@gmail.com</h4>
    <button id="contactBtn" class="contact-btn">Contact Me</button>
    <p class="copyright">Ganga Saw | my portfolio <span id="year">2026</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
